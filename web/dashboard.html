<body>
    <!-- Header / top navigation bar -->
    <header id="top-header">
        <div class="header-left">
            <div class="wordmark" id="wordmark">Local LLM Benchmark</div>
        </div>

        <nav class="header-nav" id="header-nav">
            <button class="nav-tab active" data-view="dashboard" aria-current="page" type="button">Dashboard</button>
            <button class="nav-tab" data-view="benchmark" type="button">Benchmark</button>
            <button class="nav-tab" data-view="challenges" type="button">Challenges</button>
        </nav>

        <div class="header-right">
            <a href="https://github.com/UtopikPrompt/local-llm-benchmark" class="" title="GitHub">
                <span class="icon icon-github"></span>
            </a>
        </div>
    </header>

    <div id="app-shell">

        <!-- Main content area -->
        <main id="content-area">
            <!-- Dashboard / overview panel -->
            <section id="view-dashboard" class="view-panel" data-view="dashboard">
                <div class="panel-body">
                    <div class="top-container">
                        <!-- 1. Search box for filters -->
                        <div class="filter-bar">
                            <div class="search-input-group">
                                <input class="search" id="results-search" placeholder="Filter results" type="text" />
                            </div>
                        </div>
                        <!-- 2. Table showing all results -->
                        <div class="results-table" id="results-table"></div>
                    </div>
                </div>
            </section>

            <!-- Benchmark panel -->
            <section id="view-benchmark" class="view-panel" data-view="benchmark">
                <div class="panel-body">

                    <!-- Left sidebar: engine + model selection -->
                    <aside id="side-menu">
                        <div class="side-actions">
                            <button class="refresh-models" id="refresh-models">
                                <span class="icon icon-refresh"></span>
                                <span class="label">Refresh Engines</span>
                            </button>
                            <button class="btn-add-engine" id="add-engine" type="button">
                                <span class="icon icon-plus"></span>
                                <span class="label">Add Engine</span>
                            </button>
                        </div>
                        <div id="engine-list">
                            <!-- All Models Checkbox -->
                            <div class="model-group">
                                <label class="model-checkbox-group">
                                    <input type="checkbox" id="all-models-checkbox">
                                    <span class="model-label">All Models (
                                        <?= modelList.length ?>)
                                    </span>
                                </label>
                            </div>
                            <!-- Existing engine groups will be rendered here -->
                            <div id="engine-list-content"></div>
                        </div>
                    </aside>

                    <div class="results-scroll">
                        <div id="results-container">
                            <!-- Challenges Toolbar (New Section) -->
                            <div class="panel-toolbar challenges-toolbar">
                                <div class="panel-title">Run Challenges</div>
                                <div class="panel-subtitle">Select challenges and run batch tests.</div>
                                <div class="challenge-controls">
                                    <!-- All Challenges Checkbox -->
                                    <label class="checkbox-group all-challenges-select">
                                        <input type="checkbox" id="all-challenges-checkbox">
                                        <span class="model-label">All Challenges</span>
                                    </label>
                                    <div id="challenge-status-display" class="challenge-status-display">
                                        <!-- Status indicator goes here -->
                                    </div>
                                    <button class="btn-primary" id="run-challenge-batch-button" type="button"
                                        disabled>Run All Challenges</button>
                                </div>
                            </div>

                            <!-- Challenges List (New Area) -->
                            <div id="challenges-list-container" class="challenges-list-container">
                                <div class="challenge-list-header">
                                    <h3 class="challenge-title">Challenge / Task</h3>
                                    <span class="challenge-meta">Status: <span
                                            id="challenge-status-text">Pending</span></span>
                                </div>
                                <!-- Individual challenge items will be rendered here -->
                                <div id="challenge-items-list"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Challenges / tasks panel -->
            <section id="view-challenges" class="view-panel" data-view="challenges">
                <div class="panel-body">
                    <div class="challenges-container">
                        <div class="panel-toolbar challenges-toolbar">
                            <div class="panel-title">All Challenges</div>
                            <div class="panel-subtitle">Review and manage all available benchmark tasks.</div>
                            <div class="challenge-controls">
                                <label class="checkbox-group all-challenges-select">
                                    <input type="checkbox" id="all-challenges-checkbox">
                                    <span class="model-label">Select All Challenges</span>
                                </label>
                                <div id="challenge-status-display" class="challenge-status-display">
                                    <!-- Status indicator goes here -->
                                </div>
                                <button class="btn-primary" id="run-challenge-batch-button" type="button" disabled>Run
                                    All Challenges</button>
                            </div>
                        </div>
                        <!-- 1. list of all challenges -->
                        <div id="challenges-list-container" class="challenges-list-container">
                            <div class="challenge-list-header">
                                <h3 class="challenge-title">Challenge / Task</h3>
                                <span class="challenge-meta">Status: <span
                                        id="challenge-status-text">Pending</span></span>
                            </div>
                            <!-- Individual challenge items will be rendered here -->
                            <div id="challenge-items-list" class="challenge-items-list">
                                <!-- Challenge items go here -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="/web/ui/app.js"></script>
</body>

</html>
