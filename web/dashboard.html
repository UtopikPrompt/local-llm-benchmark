<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Benchmark Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/web/ui/style.css">
</head>
<body>
    <header id="top-header">
        <h1>Local LLM Benchmark Dashboard</h1>
    </header>

    <div id="main-container">
        <!-- Side Menu -->
        <aside id="side-menu">
            <h2>Engine Models</h2>
            <button id="refresh-models" type="button" title="Reload engines and models">Refresh</button>
            <nav id="model-list">
                <!-- One section per engine, each listing its models -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main id="content-area">
            <div id="filters">
                <h2>Filters</h2>
                <select id="benchmark-type-filter">
                    <option value="">All Types</option>
                </select>
            </div>

            <div id="results-container">
                <h2>Benchmark Results</h2>
                <p id="loading-message">Loading benchmark results...</p>
            </div>
        </main>
    </div>

    <script src="/web/ui/main.js"></script>
</body>
</html>
