<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local LLM Benchmark</title>
    <script src="https://cdn.jsdelivr.net/npm/chart@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0b1120;
            --bg-grad: radial-gradient(1200px 600px at 100% -10%, #14223a 0%, transparent 60%),
                       radial-gradient(900px 500px at -10% 10%, #10203b 0%, transparent 55%);
            --panel: rgba(30, 45, 69, 0.6);
            --panel-solid: #1a2540;
            --panel-2: #24324d;
            --text: #e6edf7;
            --muted: #8ba0bd;
            --accent: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.12);
            --good: #34d399;
            --bad: #f87171;
            --border: rgba(148, 163, 184, 0.14);
            --border-strong: rgba(148, 163, 184, 0.28);
            --shadow: 0 10px 30px -12px rgba(2, 6, 18, 0.6);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            background-image: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text);
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        a { color: var(--accent); }

        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 32px;
            background: linear-gradient(180deg, rgba(30, 45, 69, 0.75), rgba(30, 45, 69, 0.25));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        header p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 14px;
        }
        .container {
            padding: 28px 32px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-end;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.02em;
        }
        input, select {
            background: var(--panel-2);
            border: 1px solid var(--border-strong);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        input::placeholder { color: #6b7f9a; }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.20);
            background: #2a3a58;
        }
        button {
            cursor: pointer;
            background: linear-gradient(180deg, #4fd0ff, #2b9de0);
            color: #04223a;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 14px;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            box-shadow: 0 6px 18px -6px rgba(56, 189, 248, 0.6);
        }
        button:hover { filter: brightness(1.08); transform: translateY(-1px); }
        button:active { transform: translateY(0); filter: brightness(0.96); }
        button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; filter: none; box-shadow: none; }
        button.secondary {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--border-strong);
            box-shadow: none;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: border-color 0.15s ease, transform 0.15s ease;
        }
        .card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
        .card .value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }
        .card .label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 22px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: var(--shadow);
        }
        .panel h2 {
            margin: 0 0 16px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .panel h2::after {
            content: "";
            display: inline-block;
            width: 3px;
            height: 16px;
            margin-left: 10px;
            vertical-align: -3px;
            border-radius: 2px;
            background: var(--accent);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            text-align: left;
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--muted);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: rgba(236, 253, 255, 0.03);
        }
        th:first-child { border-top-left-radius: 12px; }
        th:last-child { border-top-right-radius: 12px; }
        tbody tr { transition: background 0.12s ease; }
        tbody tr:hover { background: rgba(56, 189, 248, 0.06); }
        tbody tr:last-child td { border-bottom: none; }
        td .engine { font-weight: 600; }
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .badge.yes { background: rgba(52, 211, 153, 0.14); color: var(--good); border: 1px solid rgba(52, 211, 153, 0.28); }
        .badge.no { background: rgba(248, 113, 113, 0.14); color: var(--bad); border: 1px solid rgba(248, 113, 113, 0.28); }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }
        canvas { max-height: 300px; }

        .error {
            color: var(--bad);
            padding: 12px 16px;
            border: 1px solid rgba(248, 113, 113, 0.30);
            border-radius: 12px;
            background: rgba(248, 113, 113, 0.08);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .error::before {
            content: "⚠";
            font-size: 16px;
        }
        .muted { color: var(--muted); }
        .hidden { display: none !important; }

        @media (max-width: 720px) {
            .charts { grid-template-columns: 1fr; }
            .container { padding: 20px 16px; }
            header { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Local LLM Benchmark</h1>
        <p>Benchmark local LLM engines (Open LLM API) — the engine is the variable under test.</p>
    </header>
    <div class="container">
        <div class="controls">
            <div class="field">
                <label for="engine">Engine</label>
                <select id="engine">
                    <option value="">(enter a base URL)</option>
                </select>
            </div>
            <div class="field">
                <label for="base-url">Engine base URL</label>
                <input id="base-url" type="text" placeholder="Engine base URL" />
            </div>
            <div class="field">
                <label for="model">Model</label>
                <input id="model" type="text" placeholder="Model" />
            </div>
            <div class="field">
                <label for="judge-url">Judge URL (optional)</label>
                <input id="judge-url" type="text" placeholder="Judge URL (optional)" />
            </div>
            <div class="field">
                <label for="judge-model">Judge model (optional)</label>
                <input id="judge-model" type="text" placeholder="Judge model (optional)" />
            </div>
            <button id="run-btn" type="button">Run benchmark</button>
        </div>

        <div id="error" class="error" hidden></div>

        <div class="cards" id="cards"></div>

        <div class="panel">
            <h2>Results</h2>
            <div style="overflow-x:auto">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>Engine</th>
                            <th>Model</th>
                            <th>Task</th>
                            <th>Category</th>
                            <th>TTFT (s)</th>
                            <th>tok/s</th>
                            <th>iters/s</th>
                            <th>Deterministic</th>
                            <th>Judge</th>
                            <th>Passed</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="charts">
            <div class="panel">
                <h2>Throughput by engine (tok/s)</h2>
                <canvas id="throughput-chart"></canvas>
            </div>
            <div class="panel">
                <h2>Pass rate by category</h2>
                <canvas id="passrate-chart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let throughputChart, passrateChart;

        function showError(message) {
            const el = document.getElementById("error");
            el.textContent = message;
            el.hidden = false;
        }
        function clearError() {
            const el = document.getElementById("error");
            el.textContent = "";
            el.hidden = true;
        }

        async function listModels(baseURL) {
            try {
                const res = await fetch(baseURL + "/v1/models");
                if (!res.ok) return [];
                const data = await res.json();
                return (data.data || []).map((m) => m.id);
            } catch (e) {
                return [];
            }
        }

        // When the user picks an engine from the dropdown, its base URL and
        // model are auto-filled, so the base-url and model fields are hidden
        // to keep the form tidy. They reappear only when the user wants to
        // enter a base URL by hand (no engine selected).
        const engineSelect = document.getElementById("engine");
        const toggleManualFields = () => {
            const manual = document.getElementById("engine").value.trim();
            const base = document.getElementById("base-url");
            const model = document.getElementById("model");
            const show = !manual;
            base.classList.toggle("hidden", !show);
            model.classList.toggle("hidden", !show);
        };
        engineSelect.addEventListener("change", toggleManualFields);
        // Restore visibility from the initial selection (e.g. after a reload).
        toggleManualFields();

        // Populate the form fields with the server's default values on load.
        // Defaults come from the server so a page reload restores the same
        // values instead of an arbitrary previous state.
        async function loadConfig() {
            try {
                const res = await fetch("/defaults");
                if (!res.ok) return;
                const cfg = await res.json();
                const set = (id, value) => {
                    const el = document.getElementById(id);
                    if (el) el.value = value;
                };
                set("base-url", cfg.engine_base_url || "");
                set("model", cfg.engine_model || "");
                set("judge-url", cfg.judge_base_url || "");
                set("judge-model", cfg.judge_model || "");
                populateEngines(cfg.engines || []);
            } catch (e) {
                // Ignore: the form still uses its placeholder text.
            }
        }

        // Populate the engine dropdown from the engines configured on the
        // server (Defaults.engines). A single engine can be selected, and its
        // name is sent back to /run so the benchmark runs that engine from the
        // multi-engine configuration.
        function populateEngines(engines) {
            const select = document.getElementById("engine");
            select.innerHTML = '<option value="">(enter a base URL)</option>';
            engines.forEach((engine) => {
                const option = document.createElement("option");
                option.value = engine.name || "";
                option.textContent = engine.name || "(unnamed)";
                select.appendChild(option);
            });
            // Fill the base URL and model fields from the selected engine.
            const selected = select.value;
            const match = engines.find((e) => e.name && e.name === selected);
            if (match) {
                const set = (id, value) => {
                    const el = document.getElementById(id);
                    if (el) el.value = value;
                };
                set("base-url", match.base_url || "");
                set("model", match.model || "");
            }
        }

        async function runBenchmark() {
            clearError();
            const selectedEngine = document.getElementById("engine").value.trim();
            const baseUrl = document.getElementById("base-url").value.trim();
            const model = document.getElementById("model").value.trim();
            const judgeUrl = document.getElementById("judge-url").value.trim();
            const judgeModel = document.getElementById("judge-model").value.trim();

            if (!baseUrl && !selectedEngine) {
                showError("Select an engine or enter an engine base URL.");
                return;
            }

            const btn = document.getElementById("run-btn");
            btn.disabled = true;
            btn.textContent = "Running…";

            try {
                // Validate the engine advertises models.
                const models = await listModels(baseUrl);
                if (!models.length) {
                    showError("The engine returned no models. Is it running?");
                    return;
                }

                const res = await fetch("/run", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        base_url: baseUrl,
                        model: model,
                        engine: selectedEngine || null,
                        judge_url: judgeUrl || null,
                        judge_model: judgeModel || null,
                        trials: 3,
                    }),
                });

                if (!res.ok) {
                    const detail = await res.json().catch(() => "");
                    showError(detail.detail || res.statusText);
                    return;
                }

                const data = await res.json();
                render(data.rows);
            } catch (e) {
                showError(e.message || "Failed to run benchmark.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Run benchmark";
            }
        }

        function render(rows) {
            // Summary cards.
            const passed = rows.filter((r) => r.quality_passed).length;
            const avgTok = rows.length
                ? Math.round(rows.reduce((sum, r) => sum + r.tok_per_s, 0) / rows.length)
                : 0;
            const avgTTFT = rows.length
                ? (rows.reduce((sum, r) => sum + r.ttft_s, 0) / rows.length).toFixed(2)
                : "0";
            document.getElementById("cards").innerHTML = `
                <div class="card"><div class="value">${rows.length}</div><div class="label">Rows</div></div>
                <div class="card"><div class="value">${passed}/${rows.length}</div><div class="label">Passed</div></div>
                <div class="card"><div class="value">${avgTok}</div><div class="label">Avg tok/s</div></div>
                <div class="card"><div class="value">${avgTTFT}</div><div class="label">Avg TTFT (s)</div></div>
            `;

            // Table.
            const tbody = document.querySelector("#results-table tbody");
            tbody.innerHTML = rows.map((r) => `
                <tr>
                    <td class="engine">${escapeHtml(r.engine)}</td>
                    <td>${escapeHtml(r.model)}</td>
                    <td>${escapeHtml(r.task_id)}</td>
                    <td>${escapeHtml(r.category)}</td>
                    <td>${r.ttft_s.toFixed(3)}</td>
                    <td>${r.tok_per_s.toFixed(1)}</td>
                    <td>${r.iters_per_s.toFixed(1)}</td>
                    <td>${badge(r.quality_deterministic)}</td>
                    <td>${badge(r.quality_judge)}</td>
                    <td>${badge(r.quality_passed)}</td>
                </tr>
            `).join("");

            drawThroughput(rows);
            drawPassrate(rows);
        }

        function badge(value) {
            const yes = Boolean(value);
            return `<span class="badge ${yes ? "yes" : "no"}">${yes ? "yes" : "no"}</span>`;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (c) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
            }[c]));
        }

        function drawThroughput(rows) {
            const byEngine = {};
            rows.forEach((r) => {
                if (!byEngine[r.engine]) byEngine[r.engine] = [];
                byEngine[r.engine].push(r.tok_per_s);
            });
            const engines = Object.keys(byEngine);
            const values = engines.map((e) => Math.round(byEngine[e].reduce((a, b) => a + b, 0) / byEngine[e].length));
            if (throughputChart) throughputChart.destroy();
            throughputChart = new Chart(document.getElementById("throughput-chart"), {
                type: "bar",
                data: {
                    labels: engines,
                    datasets: [{ label: "tok/s", data: values, backgroundColor: "#38bdf8" }],
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: "tok/s" } },
                    },
                },
            });
        }

        function drawPassrate(rows) {
            const cats = {};
            rows.forEach((r) => {
                if (!cats[r.category]) cats[r.category] = { passed: 0, total: 0 };
                cats[r.category].total += 1;
                if (r.quality_passed) cats[r.category].passed += 1;
            });
            const labels = Object.keys(cats);
            const data = labels.map((c) => Math.round((cats[c].passed / cats[c].total) * 100));
            if (passrateChart) passrateChart.destroy();
            passrateChart = new Chart(document.getElementById("passrate-chart"), {
                type: "doughnut",
                data: {
                    labels: labels,
                    datasets: [{ data: data, backgroundColor: ["#38bdf8", "#22c55e", "#a78bfa", "#fbbf24"] }],
                },
                options: { plugins: { legend: { position: "bottom" } } },
            });
        }

        document.getElementById("run-btn").addEventListener("click", runBenchmark);

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", loadConfig);
        } else {
            loadConfig();
        }
    </script>
</body>
</html>
