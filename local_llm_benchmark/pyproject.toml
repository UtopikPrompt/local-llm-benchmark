[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-benchmark"
version = "0.1.0"
description = "Benchmark local LLM engines on quality metrics (accuracy, groundedness, and judge-based dimensions)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=18.0.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
# Engines are optional plugins. Install the one(s) you use.
vllm = ["httpx>=0.28.0"]
ollama = ["httpx>=0.28.0"]
llama-cpp = ["httpx>=0.28.0"]
transformers = ["transformers>=4.48.0", "torch>=2.5.0"]

[project.scripts]
local-llm-benchmark = "local_llm_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["local_llm_benchmark*"]

[tool.setuptools.package-data]
local_llm_benchmark = ["prompts/*.prompt"]
