[project]
name = "local-llm-benchmark"
version = "0.1.0"
description = "Benchmark local LLM engines (Ollama/LM Studio) and visualize results in a browser."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "anyio>=4.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pytest-cov>=7.1.0",
    "coverage>=7.16.1",
]
ui = [
    "uvicorn[standard]>=0.27",
]
frontend = [
    "esbuild>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Frontend build
# ---------------------------------------------------------------------------
# The web UI is authored as ES modules in web/ui/*.js and bundled into a single
# IIFE by esbuild. See build_frontend.py for the build script.
[tool.local_llm_benchmark.frontend]
# esbuild is invoked as a python package (python3 -m esbuild), not as a node
# binary, so it is listed as a runtime dependency of the build script.
build = "build_frontend:build_frontend"
source = "web/ui/main.js"
outfile = "web/ui/main.js"
format = "iife"
bundle = true
# FastAPI serves the bundled bundle from this mount point.
static_mount = "/web/ui"

[tool.hatch.build.targets.wheel]
packages = ["local_llm_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
